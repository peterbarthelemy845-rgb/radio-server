{% if turnstile_site_key() %}
<script nonce="{{ csp_nonce() }}">
(() => {
 const sitekey={{ turnstile_site_key()|tojson }};
 let loading;
 const busy=new WeakSet();
 function load(){
  if(window.turnstile)return Promise.resolve();
  if(!loading)loading=new Promise((resolve,reject)=>{
   const script=document.createElement('script');
   script.src='https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
   script.async=true;
   const timer=setTimeout(()=>{script.remove();reject(new Error('Security check could not load. Please try again.'));},15000);
   script.onload=()=>{clearTimeout(timer);resolve();};
   script.onerror=()=>{clearTimeout(timer);script.remove();reject(new Error('Security check could not load. Please try again.'));};
   document.head.appendChild(script);
  }).catch(error=>{loading=null;throw error;});
  return loading;
 }
 window.radioHumanCheck=async (form,action)=>{
  await load();
  return new Promise((resolve,reject)=>{
   const area=document.createElement('div');area.setAttribute('aria-label','Security check');
   form.appendChild(area);
   let widget,timer,done=false;
   const finish=(error,token)=>{
    if(done)return;done=true;clearTimeout(timer);
    // Remove the widget after callbacks have finished. Tokens are single-use.
    setTimeout(()=>{if(widget!==undefined)window.turnstile.remove(widget);area.remove();},0);
    if(error)reject(new Error(error));else resolve(token);
   };
   timer=setTimeout(()=>finish('Security check timed out. Please try again.'),120000);
   try{widget=window.turnstile.render(area,{sitekey,action,size:'compact',theme:'auto','response-field':false,
    callback:token=>finish(null,token),
    'error-callback':()=>finish('Security check could not complete. Please try again.'),
    'expired-callback':()=>finish('Security check expired. Please try again.')});
   }catch(error){finish('Security check could not load. Please try again.');}
  });
 };
 document.addEventListener('submit',async event=>{
  const form=event.target;
  const action=form.id==='addStationForm'||form.getAttribute('action')==='/api/add-station'?'station-submit':
   form.id==='stationEditLoginForm'?'station-access':form.getAttribute('action')==='/station-code/resend'?'station-code-resend':null;
  if(!action)return;
  if(form.dataset.securityReady==='yes'){delete form.dataset.securityReady;return;}
  event.preventDefault();event.stopImmediatePropagation();
  if(busy.has(form))return;busy.add(form);
  const button=event.submitter;if(button)button.disabled=true;
  let notice=form.querySelector('[data-security-notice]');
  if(!notice){notice=document.createElement('p');notice.dataset.securityNotice='';notice.setAttribute('role','status');form.appendChild(notice);}
  notice.textContent='Checking security…';
  try{
   const token=await window.radioHumanCheck(form,action);
   let hidden=form.querySelector('input[name="cf-turnstile-response"]');
   if(!hidden){hidden=document.createElement('input');hidden.type='hidden';hidden.name='cf-turnstile-response';form.appendChild(hidden);}
   hidden.value=token;form.dataset.securityReady='yes';notice.textContent='';
   if(button)button.disabled=false;form.requestSubmit(button||undefined);
  }catch(error){notice.textContent=error.message;}
  finally{busy.delete(form);if(button)button.disabled=false;}
 },true);
})();
</script>
{% endif %}
