<div class="card"><h2>Station deletion requests</h2>{% for item in station_deletion_requests() %}<div class="station"><div class="name">{{ item.name }}</div><p>{{ item.code }} · {{ item.email }}</p><p>{{ item.reason }}</p><div class="actions">
<form method="post" action="{{ url_for('admin_station_deletion', id=item.id, decision='approve') }}"><input type="hidden" name="owner_csrf" value="{{ owner_csrf() }}"><button class="btn reject">Approve permanent deletion</button></form>
<form method="post" action="{{ url_for('admin_station_deletion', id=item.id, decision='deny') }}"><input type="hidden" name="owner_csrf" value="{{ owner_csrf() }}"><button class="btn link">Deny request</button></form></div></div>{% else %}<div class="empty">No station deletion requests.</div>{% endfor %}</div>
