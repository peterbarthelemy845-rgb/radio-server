<style>
#submissionSuccess{width:min(420px,calc(100vw - 32px));padding:28px;border:1px solid rgba(255,255,255,.2);border-radius:24px;background:#fff;color:#0f172a;text-align:center;font-family:Arial,sans-serif;box-shadow:0 24px 70px rgba(0,0,0,.4)}
#submissionSuccess::backdrop{background:rgba(0,0,0,.65)}
#submissionSuccess h2{margin:0 0 12px;font-size:26px}
#submissionSuccess p{margin:0 0 22px;font-size:18px;line-height:1.5}
#submissionSuccess button{min-height:46px;padding:12px 28px;border:0;border-radius:14px;background:#2563eb;color:white;font-size:17px;font-weight:700;cursor:pointer}
#submissionSuccess button:focus-visible{outline:3px solid #9fd1ff;outline-offset:3px}
</style>
<dialog id="submissionSuccess" aria-labelledby="submissionSuccessTitle" aria-describedby="submissionSuccessMessage">
  <h2 id="submissionSuccessTitle">Waiting for approval</h2>
  <p id="submissionSuccessMessage">Thank you for your submission. Your station is waiting for admin approval.</p>
  <form method="dialog"><button autofocus>OK</button></form>
</dialog>
<script>
function showSubmissionSuccess(code){
  const dialog=document.getElementById('submissionSuccess');
  if(!dialog.open)dialog.showModal();
}
{% if status == 'ok' %}showSubmissionSuccess();{% endif %}
</script>
