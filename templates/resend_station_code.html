<details style="margin:16px 0"><summary style="cursor:pointer;font-weight:bold">Already registered? Edit your station</summary><form action="/station-access/request" method="post"><input type="hidden" name="owner_csrf" value="{{ owner_csrf() }}"><label for="stationAccessEmail">Registered email</label><input id="stationAccessEmail" type="email" name="email" required maxlength="254" autocomplete="email" placeholder="owner@example.com"><label for="stationAccessCode">Station code</label><input id="stationAccessCode" name="code" required inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="6-digit code"><button type="submit" class="save-btn" style="margin-top:10px">Log in to edit station</button><p>We email a private sign-in link to confirm ownership.</p></form></details>
