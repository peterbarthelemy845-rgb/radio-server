<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Advertise with us{% endblock %}</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px 14px;background:linear-gradient(#102a78,#071642);font:16px Arial;color:white}main{max-width:640px;margin:auto}h1{font-size:30px;margin:20px 0 10px}p{line-height:1.5}.card{background:white;color:#0f172a;padding:26px;border-radius:24px;margin:20px 0;box-shadow:0 18px 45px #0003}label{display:block;font-weight:bold;margin:18px 0 8px}input:not([type=checkbox]),textarea{width:100%;border:1px solid #cbd5e1;border-radius:14px;padding:14px;font:inherit}textarea{min-height:100px;resize:vertical}button,.button{display:inline-block;padding:14px 20px;min-height:48px;background:#2563eb;color:white;border:0;border-radius:14px;text-decoration:none;font:700 17px Arial;cursor:pointer}.wide{width:100%;text-align:center;margin-top:18px}.home{color:#bfdbfe}.hint{color:#64748b;font-size:14px}.error{color:#991b1b;background:#fee2e2;padding:14px;border-radius:12px}.check{display:flex;gap:10px;line-height:1.5;font-size:14px}.check input{width:20px;flex:0 0 20px}.choices{display:grid;gap:18px}.choices a{display:block}.choices p{margin:8px 0 0}button:focus-visible,a:focus-visible{outline:3px solid #38bdf8;outline-offset:3px}dialog{max-width:calc(100vw - 28px);width:420px;border:0;border-radius:22px;padding:28px;text-align:center;color:#0f172a}dialog::backdrop{background:#000b}@media(max-width:400px){.card{padding:18px}}.owner-bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;background:rgba(8,15,38,.96);border-radius:20px 20px 0 0;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -6px 24px #0003}.owner-bottom-nav a{flex:1;display:flex;align-items:center;justify-content:center;min-height:76px;color:white;text-decoration:none;font-weight:900;padding:12px 4px;text-align:center}.owner-bottom-nav a:hover{background:#ffffff12;color:#9fd1ff}body.owner-navigation{padding-bottom:calc(116px + env(safe-area-inset-bottom))!important}@media(max-width:500px){.owner-bottom-nav a{font-size:14px;min-height:72px}}</style>{% block extra_head %}{% endblock %}</head>
<body class="{% if request.path == '/owner' or request.path.startswith('/owner/') %}owner-navigation {% endif %}{% block body_class %}{% endblock %}"><main>{% block home_link %}<a class="home" href="{{ url_for('index') }}">← Home</a>{% endblock %}{% block content %}{% endblock %}</main>{% block bottom_nav %}{% if request.path == '/owner' or request.path.startswith('/owner/') %}<nav class="owner-bottom-nav" aria-label="Main navigation"><a href="{{ url_for('index') }}#radio">Radio</a><a href="{{ url_for('index') }}#library">Library</a><a href="{{ url_for('index') }}#add-station">Add Station</a><a href="{{ url_for('index') }}#shop">Shop</a></nav>{% endif %}{% endblock %}</body></html>
